# A symbol watchlist is used by every enabled stream that does not request full-market access.
symbols:
  - RELIANCE
  - TCS

# This is the default for every stream. Set it to true only when every enabled
# product has a full-market entitlement. Product-specific add-ons can instead
# enable full_feed under one stream while the others continue using this watchlist.
full_feed: false

# All populated detailed fields are shown by default. Replace ["*"] with a
# smaller field list when you want to limit a stream's Telegram output.
streams:
  news:
    enabled: true
    detailed: true
    fields: ["*"]

  block-deals:
    enabled: true
    detailed: true
    fields: ["*"]

  announcements:
    enabled: true
    detailed: true
    fields: ["*"]

  earnings:
    enabled: true
    detailed: true
    # Set this to true when the earnings add-on includes full-market access.
    # The other streams will continue using the symbol watchlist above.
    full_feed: false
    fields: ["*"]

  concalls:
    enabled: true
    detailed: true
    fields: ["*"]

  alerts:
    enabled: true
    detailed: true
    fields: ["*"]

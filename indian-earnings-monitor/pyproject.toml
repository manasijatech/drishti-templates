[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drishti-indian-earnings-monitor"
version = "0.1.0"
description = "Source-linked Indian earnings, news, and concall review queue"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
drishti-monitor = "drishti_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drishti_monitor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["drishti_monitor"]
